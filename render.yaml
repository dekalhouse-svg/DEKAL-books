services:
  - type: web
    name: dekal-books
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "25"
    # Pour une persistance locale durable de SQLite + PDF sur Render,
    # ajoutez un Persistent Disk dans le tableau de bord Render.

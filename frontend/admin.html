<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration — DEKAL Books</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><div class="container nav">
  <a class="brand" href="/">📚 <span>DEKAL Books</span></a>
  <nav><a href="/">Site</a><button id="logoutBtn" class="link-btn">Déconnexion</button></nav>
</div></header>
<main class="container admin-page">
  <div class="admin-head"><div><p class="eyebrow">Tableau de bord</p><h1>Gérer les PDF</h1></div></div>
  <form id="bookForm" class="panel form-grid" enctype="multipart/form-data">
    <h2 id="formTitle">Publier un PDF</h2>
    <input type="hidden" id="editId">
    <label>Titre<input id="title" required></label>
    <label>Auteur<input id="author" required></label>
    <label>Catégorie<select id="category" required></select></label>
    <label class="full">Description<textarea id="description" rows="4" required></textarea></label>
    <label class="full">Fichier PDF<input id="file" type="file" accept="application/pdf,.pdf" required></label>
    <div class="form-actions full"><button class="btn primary" type="submit" id="submitBtn">Publier le PDF</button><button class="btn secondary" type="button" id="cancelBtn" hidden>Annuler</button></div>
    <p id="adminMessage" class="form-message full"></p>
  </form>
  <section class="panel">
    <h2>PDF publiés</h2>
    <div class="table-wrap"><table><thead><tr><th>Titre</th><th>Catégorie</th><th>Téléchargements</th><th>Date</th><th>Actions</th></tr></thead><tbody id="adminTable"></tbody></table></div>
  </section>
</main>
<script src="/js/admin.js"></script>
</body>
</html>
